<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Página</h1>
<script>
    let n1 = parseInt(window.prompt('Digite um numero:')) // converte o dado que vem de padrao em STRING para numero INTEIRO
    let n2 = parseFloat(window.prompt('Digite outro numero: ')) // converte o dado que vem de padrao em STRING para numero REAL
    let s = n1 +  n2
    window.alert(s)
</script>
</body>
</html>
